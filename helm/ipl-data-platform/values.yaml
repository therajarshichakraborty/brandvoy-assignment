replicaCount: 2

image:
  repository: ghcr.io/yourusername/ipl-data-platform
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 80
  targetPort: 4040

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: ipl-pulse.example.com
      paths:
        - path: /
          pathType: ImplementationSpecific

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 250m
    memory: 256Mi

datadog:
  enabled: true
  env: "production"
  service: "ipl-data-platform"
