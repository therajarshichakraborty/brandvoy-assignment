services:
  postgres:
    image: postgres:17-alpine
    container_name: ipl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ipl
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ipl"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: DockerFile
    container_name: ipl-pulse-app
    restart: unless-stopped
    ports:
      - "4040:3000"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@postgres:5432/ipl
      - NODE_ENV=production
      - PORT=3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
