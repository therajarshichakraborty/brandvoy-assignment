apiVersion: v1
kind: ConfigMap
metadata:
  name: ipl-platform-config
data:
  NODE_ENV: "production"
  PORT: "4040"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ipl-data-platform
  labels:
    app: ipl-data-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ipl-data-platform
  template:
    metadata:
      labels:
        app: ipl-data-platform
    spec:
      containers:
        - name: ipl-app
          image: ghcr.io/yourusername/ipl-data-platform:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 4040
          envFrom:
            - configMapRef:
                name: ipl-platform-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: ipl-db-secret
                  key: DATABASE_URL
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4040
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4040
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ipl-data-platform-service
spec:
  type: ClusterIP
  ports:
    - port: 80
      targetPort: 4040
      protocol: TCP
  selector:
    app: ipl-data-platform
